name: CI

# No root package.json/workspace - each package installs and runs
# independently, one job per package so they run in parallel and a failure
# in one doesn't hide the others.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared:
    name: shared (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm install
        working-directory: shared
      - run: npm run typecheck
        working-directory: shared
      - run: npm test
        working-directory: shared

  server:
    name: server (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
        working-directory: shared
      - run: npm install
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    name: client (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: shared
      - run: npm install
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx tsc -b
        working-directory: client
      - run: npm test
        working-directory: client
